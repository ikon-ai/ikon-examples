ConfigVersion = 13  # Schema version: the ikon tool upgrades an older file and refuses a newer one
StateDatabase = ""  # The database PersistentReactive state lives in; empty picks the "app" database (databases guide)
DomainAllowlist = []  # Email domains that may become members, e.g. ["mycompany.com"]; empty admits any. Applies to the deployed app, not a local run (sso guide)
MaxClients = 0  # Clients an instance admits, and a shard's size with [Sharding] on; 0 fits it to the container's memory (scaling guide)

# More instances, called shards, for one identity value that fills its instance (scaling guide, "Sharding")
[Sharding]
Enabled = false  # true: a client that finds its instance full joins another instance of the same identity, instead of being refused with 429; live audio and video stay within one shard (scaling guide)
MaxShards = 0  # The most shards one identity value runs; 0 sets no cap of the app's own

# The kinds of visitor, one [[Surface]] each; with none, one surface admits guests at "/". With several, exactly one that is not a SignIn page has neither Routes nor Host, and it serves every other path (app-structure guide, "Surfaces")
[[Surface]]
Name = "app"  # Unique in the app; a handler reads it as Context.Surface
Routes = ["/"]  # The paths it serves, e.g. ["/", "/pricing"], captured as boot snapshots at deploy; with one surface, list every page's path; with several, the one that serves every other path has none
Host = ""  # A hostname label of its own: "admin" serves it only at <space>-admin; empty selects it by route
Connect = "atLoad"  # "atLoad"; "onAction" connects on the visitor's first action; "none" never connects
Media = "atConnect"  # "atConnect" sets up the WebRTC media connection; camera and microphone open only when the app starts a capture. "none" never does
Presence = true  # Whether clients learn who else is in the session; false for a public page
Seeds = []  # What a route paints while it connects, as "pattern:variantId" rules, e.g. ["/**:shell"]
Placement = "shared"  # "shared": the instance the visitor's identity selects; "own": an instance of its own
Recovery = "attended"  # "attended" waits for a tap after a lost connection, for a signed-in app on personal phones too; "unattended" reloads by itself, for kiosks; "seamless" keeps the page and reconnects to a new session when the visitor is back, for public pages

# Who may enter the surface
[Surface.Auth]
Methods = ["google", "microsoft", "email", "guest"]  # Sign-in providers from a fixed set ("google", "apple", "microsoft", "email", "passkey", "sso", "phone"; no GitHub or password), and "guest" (a user per visitor) or "global" (one shared user); neither requires sign-in
Roles = []  # Roles a signed-in person must hold at least one of, e.g. ["admin"]; empty admits every signed-in person. With Roles set, every external function needs [Surface("name")]. A local run admits your own sign-in without checking it; test a role with `ikon browse --as-user <name> --role <role>`
SignIn = ""  # The surface that draws this one's sign-in page in C#; empty shows the stock sign-in screen

# The emailed sign-in code, how long a browser stays signed in, and the sign-in screen's text (app-structure guide)
[SignIn]
CodeFormat = "alphanumeric"  # "alphanumeric" or "digits"
CodeLength = 0  # 8-12 for "alphanumeric", 6-10 for "digits"; 0 takes 9 or 6
SessionDays = 7  # Days a browser stays signed in after it was last used, 1-400
Title = ""  # The sign-in screen's heading; empty keeps the stock heading
Subtitle = ""  # The line under the heading; empty keeps the stock line
EmailHint = ""  # The email field's hint, e.g. "Use your company address"; empty keeps the stock hint

# The privacy notice and terms: legal/privacy.md and legal/terms.md in the app root, served at the paths below (app-structure guide)
[Legal]
PrivacyUrl = ""  # An https:// URL that PrivacyPath redirects to; empty serves legal/privacy.md
TermsUrl = ""  # An https:// URL that TermsPath redirects to; empty serves legal/terms.md
PrivacyPath = "/legal/privacy"  # Absolute, no file extension, not under /ikon or /api
TermsPath = "/legal/terms"  # The same rules as PrivacyPath

# The platform's feedback sheet; who is offered it is the space's setting, 'ikon feedback set' (parallax-overview guide)
[Feedback]
Button = "overlay"  # "overlay" draws a floating feedback button for whoever is offered feedback, and its text follows the visitor's language; "none" draws none

# Usage measurement, of people who granted ConsentPurposes.UsageMeasurement; only a deployed app sends its events (consent guide)
[Analytics]
UIActions = false  # Record each action a person runs, which a report filed from the app then carries

# Fixed answers or redirects on paths of the app's domain, sent without starting the app (app-structure guide)
# [[PathResponse]]
# Path = ""  # Exact, or ending in "/*" for a prefix; not "/*", and nothing under /api, /ikon or /__ikon
# Methods = ["*"]  # The methods it answers, e.g. ["GET"]; ["*"] answers every method, and "GET" also answers HEAD
# Status = 0  # 200-599 for a Body, 301, 302, 307 or 308 for a Redirect; 0 takes 503 or 308
# ContentType = "text/plain; charset=utf-8"  # The Body's Content-Type
# Body = ""  # The response body, at most 16 KB; not with Redirect
# Redirect = ""  # A path on the app's own host or an https:// URL; "{*}" takes what the Path's "/*" matched
# Headers = []  # Extra response headers as "Name: value", e.g. ["Retry-After: 3600"]

# Raw public TCP, UDP or TLS ports, one [[Port]] each, read as app.Ports (endpoints-webhooks guide)
# [[Port]]
# Name = ""  # Unique in the app; the app reads the port as app.Ports["<name>"]
# Protocol = "tcp"  # "tcp" passes the stream through, TLS included; "udp" passes datagrams; "tls" ends TLS at the relay, on a shared Number only at a label
# Number = 0  # 0 reserves a number of the app's own from the region's pool, which the space needs an allowance for (port.per-space, 0 by default); 1024-9999 shares that well-known number, e.g. 8089, open to every space, and a verified hostname picks the app ('ikon hostname create <name> --port <Name>'); a device that speaks TLS can use 8089 with Labels = ["<name>"] and Protocol = "tls", with no allowance and no DNS of its own
# Allow = []  # Source address ranges allowed to connect, e.g. ["203.0.113.0/24"]; empty admits any source
# Labels = []  # Names IKON issues for a shared Number, one per label: "plant" is reached at <space>-plant.ports-<region>.<relay zone>, verified and routed at deploy with no DNS of your own

# Programs the tool downloads into tools/<runtime>/ rather than the app committing them, one [[Tools]] entry per download, each verified against a SHA-256; nothing is executed to fetch them (app-container guide)
# One download the tool makes into the runtime folder it names
# [[Tools]]
# Runtime = "all"  # The runtime folder this fills: "linux-x64" for a deploy, the machine's runtime for a local run, or "all"
# Url = ""  # The https:// URL to fetch
# Sha256 = ""  # The SHA-256 of what the URL returns, as 64 hex characters; a mismatch fails the fetch
# Archive = "none"  # "zip" or "tar.gz" extracts; "none" writes the bytes as one file
# Strip = 0  # Path components dropped from every entry of an extracted archive, like docker ADD --strip-components
# Dest = ""  # Where the result goes inside the runtime folder; empty is the folder's root
# Name = ""  # The written file's name when Archive is "none"; empty takes the URL's last segment

# Commands the ikon tool runs in the app root, each started without a shell (app-container guide). None runs on every build: for that, add an MSBuild target with BeforeTargets="BeforeBuild" to the app's csproj
[Scripts]
PrePackage = []  # Process the staged bundle after the build and before 'ikon bundle' or 'ikon deploy' zips it; 'ikon run' does not run it, and it runs only in a project that has allowed the commands with 'ikon scripts enable'

# The native app the Flutter frontend builds; set it only to update an app already in a store (frontend-fundamentals guide)
[Flutter]
IOSBundleId = ""  # The iOS bundle identifier, e.g. "com.example.events"; empty takes AndroidApplicationId, then app.ikon.s<space id>
AndroidApplicationId = ""  # The Android applicationId, e.g. "com.example.events"; empty takes IOSBundleId, then app.ikon.s<space id>
AppleTeamId = ""  # The Apple Developer team that signs the iOS app; turns on iOS universal links
AndroidCertFingerprints = []  # SHA-256 fingerprints of the certificates that sign the Android app; turns on Android app links
AssociatedDomains = []  # Hostnames besides the app's own whose https links open the app

# What activating a deployed version does
[Activation]
StopSessions = true  # Stop every session of the app, so every client reconnects to the new version; false stops only yours

# Where this file deploys to, written by 'ikon link'
[Target]
SpaceId = ""  # The app's id
Name = ""  # The app's name, shown as its title (frontend-fundamentals guide)
Environment = ""  # "development" or "production" in a named target's file; empty in an environment's own file
