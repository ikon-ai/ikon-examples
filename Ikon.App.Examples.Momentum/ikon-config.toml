# Schema version. The ikon tool upgrades older files and saves at its current version; a file newer
# than the tool refuses to load (update the tool).
ConfigVersion = 9

# The space database that backs PersistentReactive state. Empty: the platform picks the built-in
# "app" database, or the space's only platform-managed one, and records the choice so it stays put.
# Set it only to override; it must be a name 'ikon db list' shows. A deploy records it as the space's
# state store. State saved in the store it replaces is not copied over, and clearing the setting later
# does not move state back. A name the space has no database for leaves the store as it is, with a
# deploy warning. A local run with an unknown name logs a warning and keeps state in asset storage.
StateDatabase = ""

# Which email domains may become members of the space (e.g. ["mycompany.com"]). Empty admits every
# domain. It is checked when a person's profile is created, so anyone who already has a profile, or
# who was invited at a verified email address, still gets in from any domain. Anonymous visitors are
# not members, so a surface that admits them is unaffected.
DomainAllowlist = []

# How many clients one instance admits before it refuses more with 429. 0 fits the limit to the memory
# of the container the instance runs in, at what a client of an ordinary app costs, fewer on a surface
# with media or presence. Set a number when your app's clients cost much more or less than that, or
# for a reason of your own, such as a game for four players. IApp.MaxClients in code overrides it.
MaxClients = 0

# How the app's people sign in: the code the email sign-in sends, how long a browser stays signed in,
# and the sign-in screen's own text
[SignIn]
# What the emailed sign-in code is made of: "alphanumeric" (letters and digits no reader confuses
# with each other) or "digits", which the stock sign-in form takes on a numeric keypad.
CodeFormat = "alphanumeric"
# How many characters the code has: 8-12 for "alphanumeric", 6-10 for "digits". 0 takes the
# format's default, 9 or 6. A code allows five wrong tries and an address gets five codes an hour.
CodeLength = 0
# How many days a browser stays signed in after it was last used, 1-400. Every visit renews it,
# so a person who keeps coming back is never signed out. The same for every sign-in method.
SessionDays = 7
# The sign-in screen's heading, on the web and on the Flutter frontend. Empty keeps the stock
# heading in the visitor's language.
Title = ""
# The line under the heading. A reason the app passes to ClientFunctions.LoginShowAsync is shown in
# its place. Empty keeps the stock line.
Subtitle = ""
# The hint in the email field (e.g. "Use your company address"). Empty keeps the stock hint.
EmailHint = ""

# What happens when a version of the app is activated (activation is separate from deployment)
[Activation]
# Stop all active sessions of the app on activation
StopSessions = true

# The platform's feedback sheet: report a problem or an idea by text, voice, files and screenshot.
# Reports go to the app's space ('ikon issue list --source person', Studio). Who is offered it is the
# space's setting, which is off for a new app: turn it on with 'ikon feedback set --audience signed-in'
# or in Studio (Settings > Sharing), and 'ikon feedback status' shows it. A deployed app follows a
# change at once, a local run when it next starts. The platform draws its own button;
# ClientFunctions.OpenFeedbackAsync is only for an app that wants a control of its own.
[Feedback]
# "overlay": a floating feedback button the platform draws for everyone offered feedback, so the
# app needs no control of its own. Feedback starts off, so it
# shows only after 'ikon feedback set --audience'. "none": no button.
Button = "overlay"

# Usage measurement. An event names the feature and the control, never what anyone typed, picked or sent.
[Analytics]
# Record an event per action a person runs: feature, control, success and duration. A report filed
# from the app then carries the last few actions that led to it. Records only users who granted
# ConsentPurposes.UsageMeasurement.
UiActions = false

# The app's privacy notice and terms. Write legal/privacy.md and legal/terms.md in the app root (beside
# public/ and data/) and each is served as a page at its path below, or set a URL to redirect that
# path to your own page. With neither, the path stays the app's own route.
[Legal]
# Absolute https:// URL of a privacy notice published elsewhere. Empty serves legal/privacy.md.
PrivacyUrl = ""
# Absolute https:// URL of terms published elsewhere. Empty serves legal/terms.md.
TermsUrl = ""
# Path the privacy notice is served at: absolute, no file extension, not under /ikon or /api. Link to
# it with rel="external" so the browser loads the page instead of the app routing it.
PrivacyPath = "/legal/privacy"
# Path the terms are served at, with the same rules as PrivacyPath
TermsPath = "/legal/terms"

# Custom packaging steps for 'ikon bundle' and 'ikon deploy'
[Package]
# Commands run in the app root after the build, before zipping (e.g. ["python app-scripts/pack_assets.py"]).
# IKON_BUNDLE_APP_DIR becomes the app's folder on the server (its Data/ is app.Files.Data; binaries and
# #! scripts keep their execute bit); programs written to IKON_BUNDLE_TOOLS_DIR are on the deployed
# app's PATH; IKON_BUNDLE_FRONTEND_DIR is the frontend build. Anything else under IKON_BUNDLE_DIR is
# zipped but never reaches the server.
PrePackage = []

# Programs the app starts that are downloaded rather than committed to its tools/ folder
[Tools]
# Commands run in the app root that fill IKON_TOOLS_DIR (tools/<runtime>/) for IKON_TOOLS_RUNTIME (e.g.
# ["python app-scripts/fetch_tools.py"]): before 'ikon run' for this machine, before 'ikon run --container'
# for linux-x64 (linux-arm64 on Arm), and before 'ikon bundle'/'ikon deploy' for linux-x64; 'ikon build'
# does not run them. A command starts its program directly, without a shell, with the PATH the ikon tool
# has, and a program it starts by name is the first one on that PATH. They run every time, so return
# quickly when the folder is complete and do nothing for a runtime you have no programs for. Keep the
# folder out of git.
Fetch = []

# The native app the Flutter frontend builds into: its store identity and the links that open it. Read
# by 'ikon bundle', 'ikon deploy', 'ikon distribute' and 'ikon device install'. Leave it empty for a new
# app; set it to ship as an update of an app already in the App Store or Google Play.
[Flutter]
# The iOS bundle identifier (e.g. "com.example.events"): letters, digits, "-" and ".", two segments
# or more. Empty takes app.ikon.s<space id>. Used as it is in production; a development build adds
# ".dev", so both can be installed side by side. Empty takes AndroidApplicationId when that is set.
IosBundleId = ""
# The Android applicationId (e.g. "com.example.events"): two segments or more, each a letter then
# letters, digits or "_", and no Java keyword. Empty takes IosBundleId, then app.ikon.s<space id>.
# Development builds add ".dev" as on iOS.
AndroidApplicationId = ""
# The Apple Developer team that signs the iOS app: 10 capital letters and digits. Turns on iOS
# universal links (the associated-domains entitlement and the domain's
# /.well-known/apple-app-site-association), and is the team 'ikon bundle --signing self' signs with
# when --apple-team is not given.
AppleTeamId = ""
# SHA-256 fingerprints of the certificates that sign the Android app ("AB:CD:…", 32 bytes): the
# upload key's and, with Play App Signing, the app signing key's from the Play Console. Turns on
# Android app links (a verified intent filter and the domain's /.well-known/assetlinks.json). Not
# secret: these identify a certificate, they cannot sign anything.
AndroidCertFingerprints = []
# Hostnames besides the app's own whose https links open the app, such as a domain served by another
# system. The app's platform hostname and its custom hostnames with web serving are always included.
# Each one must serve the same two /.well-known files the app's own domain serves.
AssociatedDomains = []

# Target information for deployment (automatically configured with 'ikon link')
[Target]
SpaceId = ""
Name = ""
# The platform a named target's app lives on, "development" or "production", written by 'ikon link'
# and 'ikon deploy'. A command given this file's --target runs there, and --dev or --prod naming the
# other one is refused, except by 'ikon link', which moves the target. Empty in an environment's own
# file, whose name says which one it is.
Environment = ""

# The kinds of visitor the app serves, one [[Surface]] each: who may enter, which routes belong to
# it, when it connects and negotiates media, and whether its clients see each other. With no
# [[Surface]] declared, the app has one surface: anonymous entry as "guest" beside the default
# sign-in providers, "/" captured, connecting at load. The app-structure guide describes surfaces
# in full.

# Raw public ports the app serves, one [[Port]] each. 'ikon deploy' reserves a number for each, and the
# address (ports-<region>.ikon-relay.ikonai.app:<number>) stays the same across deploys, restarts and
# idle stops until the [[Port]] is removed. The app reads it from app.Ports and listens on its
# LocalPort; the first connection or datagram starts a stopped app.

# Fixed answers or redirects that the platform's frontend router sends on chosen paths of the app's
# domain, for any method, without starting the app. Each is one [[PathResponse]]. They are meant for a
# site the app took over from another system: a 503 with Retry-After so that system's open tabs keep
# their sessions, or a redirect that sends its public URLs to the app's own endpoints. The router
# checks them before every page, file and route of the app.
