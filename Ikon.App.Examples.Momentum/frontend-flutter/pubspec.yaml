name: ikon_app_examples_momentum
description: Ikon AI App Flutter frontend

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  ikon_sdk: ^1.8.0
  # The map on mobile. The web frontend draws the same `momentum-map` node with Leaflet; both take
  # their track, their emphasis and their markers from one call in the C# app.
  flutter_map: ^8.2.2
  latlong2: ^0.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Launcher icons for Android, iOS and web are generated by the ikon tool from the app's
# shared branding/logo.svg (see `ikon app icon generate`). To rebrand, replace branding/logo.svg
# and run `ikon app icon generate`.
