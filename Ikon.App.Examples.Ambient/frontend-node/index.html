<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ikon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambient</title>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div style="margin:48px auto 0;max-width:420px;padding:0 24px;text-align:center;color:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
        <div style="font-size:22px;font-weight:600;margin-bottom:10px;">JavaScript is required</div>
        <div style="font-size:15px;line-height:1.5;">This app needs JavaScript to run. Please enable JavaScript in your browser settings and reload the page.</div>
      </div>
    </noscript>

    <!-- Browser compatibility gate. Keep the feature list in sync with the SDK's checkBrowserSupport(). -->
    <script>
      function ikonMissingFeatures() {
        var missing = [];
        if (typeof WebSocket === 'undefined') missing.push('WebSocket');
        if (typeof fetch === 'undefined') missing.push('fetch');
        if (typeof BigInt === 'undefined') missing.push('BigInt');
        if (typeof globalThis === 'undefined') missing.push('globalThis');
        if (typeof Promise === 'undefined' || typeof Promise.allSettled !== 'function') missing.push('Promise.allSettled');
        return missing;
      }
      function ikonShowUnsupported() {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div style="margin:48px auto 0;max-width:420px;padding:0 24px;text-align:center;color:#000;' +
          'font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">' +
          '<div style="font-size:22px;font-weight:600;margin-bottom:10px;">Browser not supported</div>' +
          '<div style="font-size:15px;line-height:1.5;">This app needs a more recent browser to run. ' +
          'Please update your browser or device software and try again.</div>' +
          '</div>';
      }
      if (ikonMissingFeatures().length > 0) {
        ikonShowUnsupported();
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
