name: ikon_app_platform_validation
description: Ikon AI App Flutter frontend

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  ikon_sdk: ^1.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Launcher icons for Android, iOS and web are generated by the ikon tool from the app's
# shared branding/logo.png (see `ikon icon`). To rebrand, replace branding/logo.png
# (square, 1024x1024) and run `ikon icon`.
