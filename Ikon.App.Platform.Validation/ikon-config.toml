# Schema version. The ikon tool upgrades older files and saves at its current version; a file newer
# than the tool refuses to load (update the tool).
ConfigVersion = 8

# The space database that backs PersistentReactive state. Empty: the platform picks the built-in
# "app" database, or the space's only platform-managed one, and records the choice so it stays put.
# Set it only to override; it must be a name 'ikon db list' shows. An unknown name logs a warning and
# state falls back to asset storage.
StateDatabase = ""

# Which email domains may become members of the space (e.g. ["mycompany.com"]). Empty admits every
# domain. It is checked when a person's profile is created, so anyone who already has a profile, or
# who was invited at a verified email address, still gets in from any domain. Anonymous visitors are
# not members, so a surface that admits them is unaffected.
DomainAllowlist = []

# What happens when a version of the app is activated (activation is separate from deployment)
[Activation]
# Stop all active sessions of the app on activation
StopSessions = false

# The platform's feedback sheet: report a problem or an idea by text, voice, files and screenshot.
# Reports go to the app's space ('ikon issue list --source person', Studio). Who is offered it is the
# space's setting, which is off for a new app: turn it on with 'ikon feedback set --audience signed-in'
# or in Studio (Settings > Sharing), and 'ikon feedback status' shows it. A deployed app follows a
# change at once, a local run when it next starts. The platform draws its own button;
# ClientFunctions.OpenFeedbackAsync is only for an app that wants a control of its own.
[Feedback]
# "overlay": a floating feedback button the platform draws for everyone offered feedback, so the
# app needs no control of its own. Feedback starts off, so it
# shows only after 'ikon feedback set --audience'. "none": no button.
Button = "overlay"

# Usage measurement. An event names the feature and the control, never what anyone typed, picked or sent.
[Analytics]
# Record an event per action a person runs: feature, control, success and duration. A report filed
# from the app then carries the last few actions that led to it. Records only users who granted
# ConsentPurposes.UsageMeasurement.
UiActions = false

# The app's privacy notice and terms. Write legal/privacy.md and legal/terms.md in the app root (beside
# public/ and data/) and each is served as a page at its path below, or set a URL to redirect that
# path to your own page. With neither, the path stays the app's own route.
[Legal]
# Absolute https:// URL of a privacy notice published elsewhere. Empty serves legal/privacy.md.
PrivacyUrl = ""
# Absolute https:// URL of terms published elsewhere. Empty serves legal/terms.md.
TermsUrl = ""
# Path the privacy notice is served at: absolute, no file extension, not under /ikon or /api. Link to
# it with rel="external" so the browser loads the page instead of the app routing it.
PrivacyPath = "/legal/privacy"
# Path the terms are served at, with the same rules as PrivacyPath
TermsPath = "/legal/terms"

# Custom packaging steps for 'ikon bundle' and 'ikon deploy'
[Package]
# Commands run in the app root after the build, before zipping (e.g. ["python app-scripts/pack_assets.py"]).
# IKON_BUNDLE_APP_DIR becomes the app's folder on the server (its Data/ is app.Files.Data; binaries and
# #! scripts keep their execute bit); programs written to IKON_BUNDLE_TOOLS_DIR are on the deployed
# app's PATH; IKON_BUNDLE_FRONTEND_DIR is the frontend build. Anything else under IKON_BUNDLE_DIR is
# zipped but never reaches the server.
PrePackage = []

# Programs the app starts that are downloaded rather than committed to its tools/ folder
[Tools]
# Commands run in the app root that fill IKON_TOOLS_DIR (tools/<runtime>/) for IKON_TOOLS_RUNTIME (e.g.
# ["python app-scripts/fetch_tools.py"]): before 'ikon run' for this machine, before 'ikon run --container'
# for linux-x64 (linux-arm64 on Arm), and before 'ikon bundle'/'ikon deploy' for linux-x64; 'ikon build'
# does not run them. A command starts its program directly, without a shell, with the PATH the ikon tool
# has, and a program it starts by name is the first one on that PATH. They run every time, so return
# quickly when the folder is complete and do nothing for a runtime you have no programs for. Keep the
# folder out of git.
Fetch = []

# Target information for deployment (automatically configured with 'ikon link')
[Target]
SpaceId = ""
Name = ""
# The platform a named target's app lives on, "development" or "production", written by 'ikon link'
# and 'ikon deploy'. A command given this file's --target runs there, and --dev or --prod naming the
# other one is refused, except by 'ikon link', which moves the target. Empty in an environment's own
# file, whose name says which one it is.
Environment = ""

# The kinds of visitor the app serves, one [[Surface]] each: who may enter, which routes belong to
# it, when it connects and negotiates media, and whether its clients see each other. With no
# [[Surface]] declared, the app has one surface: anonymous entry as "guest" beside the default
# sign-in providers, "/" captured, connecting at load. The app-structure guide describes surfaces
# in full.
# One kind of visitor. A browser picks the surface whose Routes match the path it opened, among the
# surfaces its visitor could enter: a signed-in person skips a surface whose methods are all
# anonymous. The surface with neither Routes nor Host serves everything else. With one surface
# declared, that one serves everything. A native client names its surface when it connects.
[[Surface]]
# The surface's name, unique in the app. The app reads it from Context.Surface.
Name = "app"
# The routes that belong to this surface (e.g. ["/", "/pricing"]), each a path the app serves
# without redirecting. They are captured as boot snapshots at deploy and, when the surface admits
# anonymous visitors, prerendered to crawlable HTML with a sitemap. A route listed by two surfaces
# is an error. Content routes (one per article) are added in code with app.OnSnapshotRoutes(...).
Routes = ["/", "/typography", "/buttons", "/cards"]
# A hostname label for a surface that must be its own origin, such as an admin console: "admin" gives
# it <space>-admin under the app domain, and a visitor enters it only from that hostname. Empty for a
# surface selected by route.
Host = ""
# When the browser opens a session: "atLoad" as the page loads; "onAction" paints the route's
# snapshot and connects on the visitor's first action, for pages many read and few act on; "none"
# never connects, for a page with no server-handled control at all.
Connect = "atLoad"
# How the connection is carried: "full", a channel through the server's web endpoints; "light", a
# WebSocket on the server's own light port, where an idle client costs only its socket, TLS session
# and channel, for a surface many people watch at once. Media = "none" and Presence = false keep
# a light surface's clients cheapest.
Transport = "full"
# Whether the client opens a WebRTC connection for audio and video: "atConnect" opens it with the
# connection; "none" never does, for a surface without media.
Media = "atConnect"
# Whether the surface's clients learn who else is in the session and are announced to them. Set
# false for a public page, where nobody reads the list and announcing visitors would only add
# traffic.
Presence = true
# What a route of this surface paints while it connects, as ordered "pattern:variantId" rules, first
# match wins. A segment is a literal, "*" (one segment) or a final "**" (the rest), so "/**:shell"
# matches every path. Each variant id is captured once as a skeleton the app renders by branching on
# view.SnapshotVariant == "id". Variants are never prerendered or listed in the sitemap. A route
# without a matching rule paints its own snapshot.
Seeds = []
# Which process serves the surface: "shared", the app instance its visitors' identity selects; "own",
# an instance of its own with its own capacity and idle budget, which admits no other surface's
# client. A local run serves every surface from its one process.
Placement = "shared"

# Who may enter the surface
[Surface.Auth]
# Sign-in providers (google, apple, microsoft, signicat, email, passkey) and anonymous entry: "guest"
# gives each visitor a private, device-scoped anonymous user; "global" gives every visitor one shared
# anonymous user on shared app instances (scale out with [Sharded] on the SessionIdentity record;
# detect with Context.IsGlobal). A surface that lists neither requires sign-in, and its sign-in screen
# offers the listed providers. Any signed-in person may enter, whichever provider they used. "phone"
# adds a QR code to the sign-in screen that a phone signed in to the app approves.
Methods = ["google", "apple", "microsoft", "signicat", "email", "passkey", "sso", "guest"]
# Roles a signed-in person must hold to enter (e.g. ["admin"]), checked when they connect and on every
# function call from the surface. Empty admits every signed-in person.
Roles = []
