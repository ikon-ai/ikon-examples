ConfigVersion = 10  # Schema version: the ikon tool upgrades an older file and refuses a newer one
StateDatabase = ""  # The database PersistentReactive state lives in; empty picks the "app" database (databases guide)
DomainAllowlist = []  # Email domains that may become members, e.g. ["mycompany.com"]; empty admits any (sso guide)
MaxClients = 0  # Clients an instance admits before refusing with 429; 0 fits it to the container's memory (scaling guide)

# The kinds of visitor, one [[Surface]] each; with none, one surface admits guests at "/" (app-structure guide, "Surfaces")
[[Surface]]
Name = "app"  # Unique in the app; a handler reads it as Context.Surface
Routes = []  # The paths it serves, e.g. ["/", "/pricing"], captured as boot snapshots at deploy
Host = ""  # A hostname label of its own: "admin" serves it only at <space>-admin; empty selects it by route
Connect = "atLoad"  # "atLoad"; "onAction" connects on the visitor's first action; "none" never connects
Media = "atConnect"  # "atConnect" opens WebRTC audio and video; "none" never does
Presence = true  # Whether clients learn who else is in the session; false for a public page
Seeds = []  # What a route paints while it connects, as "pattern:variantId" rules, e.g. ["/**:shell"]
Placement = "shared"  # "shared": the instance the visitor's identity selects; "own": an instance of its own
Recovery = "attended"  # "attended" waits for a tap after a lost connection; "unattended" reloads by itself, for kiosks

# Who may enter the surface
[Surface.Auth]
Methods = ["google", "apple", "microsoft", "signicat", "email", "passkey", "sso", "guest"]  # Sign-in providers, and "guest" (a user per visitor) or "global" (one shared user); neither requires sign-in
Roles = []  # Roles a signed-in person must hold, e.g. ["admin"]; empty admits every signed-in person
SignIn = ""  # The surface that draws this one's sign-in page in C#; empty shows the stock sign-in screen

[[Surface]]
Name = "site"
Routes = ["/surfaces/site"]
Host = ""
Connect = "onAction"
Media = "none"
Presence = false
Seeds = ["/surfaces/site/**:site-shell"]
Placement = "shared"
Recovery = "attended"

[Surface.Auth]
Methods = ["global"]
Roles = []
SignIn = ""

[[Surface]]
Name = "static"
Routes = ["/surfaces/static"]
Host = ""
Connect = "none"
Media = "atConnect"
Presence = true
Seeds = []
Placement = "shared"
Recovery = "attended"

[Surface.Auth]
Methods = ["guest"]
Roles = []
SignIn = ""

[[Surface]]
Name = "members"
Routes = ["/surfaces/members"]
Host = ""
Connect = "atLoad"
Media = "atConnect"
Presence = true
Seeds = []
Placement = "shared"
Recovery = "attended"

[Surface.Auth]
Methods = ["google", "microsoft", "email"]
Roles = []
SignIn = ""

[[Surface]]
Name = "staff"
Routes = ["/surfaces/staff"]
Host = ""
Connect = "atLoad"
Media = "atConnect"
Presence = true
Seeds = []
Placement = "shared"
Recovery = "attended"

[Surface.Auth]
Methods = ["google", "microsoft", "email"]
Roles = ["moderator"]
SignIn = ""

[[Surface]]
Name = "console"
Routes = []
Host = "console"
Connect = "atLoad"
Media = "atConnect"
Presence = true
Seeds = []
Placement = "own"
Recovery = "attended"

[Surface.Auth]
Methods = ["guest"]
Roles = []
SignIn = ""

[[Surface]]
Name = "gated"
Routes = ["/surfaces/gated"]
Host = ""
Connect = "atLoad"
Media = "atConnect"
Presence = true
Seeds = []
Placement = "shared"
Recovery = "attended"

[Surface.Auth]
Methods = ["google", "microsoft", "email"]
Roles = []
SignIn = "login"

[[Surface]]
Name = "login"
Routes = []
Host = ""
Connect = "atLoad"
Media = "none"
Presence = false
Seeds = []
Placement = "shared"
Recovery = "attended"

[Surface.Auth]
Methods = ["global"]
Roles = []
SignIn = ""

[[Surface]]
Name = "kiosk"
Routes = ["/surfaces/kiosk"]
Host = ""
Connect = "atLoad"
Media = "none"
Presence = true
Seeds = []
Placement = "shared"
Recovery = "unattended"

[Surface.Auth]
Methods = ["guest"]
Roles = []
SignIn = ""

# The emailed sign-in code, how long a browser stays signed in, and the sign-in screen's text (app-structure guide)
[SignIn]
CodeFormat = "digits"  # "alphanumeric" or "digits"
CodeLength = 8  # 8-12 for "alphanumeric", 6-10 for "digits"; 0 takes 9 or 6
SessionDays = 7  # Days a browser stays signed in after it was last used, 1-400
Title = "Sign in to Validation"  # The sign-in screen's heading; empty keeps the stock heading
Subtitle = "The members and staff probes need an account"  # The line under the heading; empty keeps the stock line
EmailHint = "Use your validation address"  # The email field's hint, e.g. "Use your company address"; empty keeps the stock hint

# The privacy notice and terms: legal/privacy.md and legal/terms.md in the app root, served at the paths below (app-structure guide)
[Legal]
PrivacyUrl = ""  # An https:// URL that PrivacyPath redirects to; empty serves legal/privacy.md
TermsUrl = ""  # An https:// URL that TermsPath redirects to; empty serves legal/terms.md
PrivacyPath = "/legal/privacy"  # Absolute, no file extension, not under /ikon or /api
TermsPath = "/legal/terms"  # The same rules as PrivacyPath

# The platform's feedback sheet; who is offered it is the space's setting, 'ikon feedback set' (parallax-overview guide)
[Feedback]
Button = "overlay"  # "overlay" draws a floating feedback button for whoever is offered feedback; "none" draws none

# Usage measurement, of people who granted ConsentPurposes.UsageMeasurement (consent guide)
[Analytics]
UiActions = false  # Record each action a person runs, which a report filed from the app then carries

# Fixed answers or redirects on paths of the app's domain, sent without starting the app (app-structure guide)
# [[PathResponse]]
# Path = ""  # Exact, or ending in "/*" for a prefix; not "/*", and nothing under /api, /ikon or /__ikon
# Methods = ["*"]  # The methods it answers, e.g. ["GET"]; ["*"] answers every method, and "GET" also answers HEAD
# Status = 0  # 200-599 for a Body, 301, 302, 307 or 308 for a Redirect; 0 takes 503 or 308
# ContentType = "text/plain; charset=utf-8"  # The Body's Content-Type
# Body = ""  # The response body, at most 16 KB; not with Redirect
# Redirect = ""  # A path on the app's own host or an https:// URL; "{*}" takes what the Path's "/*" matched
# Headers = []  # Extra response headers as "Name: value", e.g. ["Retry-After: 3600"]

# Raw public TCP, UDP or TLS ports, one [[Port]] each, read as app.Ports (endpoints-webhooks guide)
# [[Port]]
# Name = ""  # Unique in the app; the app reads the port as app.Ports["<name>"]
# Protocol = "tcp"  # "tcp" passes the stream through, TLS included; "udp" passes datagrams; "tls" ends TLS at the relay
# Allow = []  # Source address ranges allowed to connect, e.g. ["203.0.113.0/24"]; empty admits any source

# Commands the ikon tool runs in the app root, each started without a shell (app-container guide)
[Scripts]
FetchTools = []  # Download programs into IKON_TOOLS_DIR before 'ikon run', 'ikon bundle' and 'ikon deploy'
PrePackage = []  # Process the staged bundle after the build and before 'ikon bundle' or 'ikon deploy' zips it

# The native app the Flutter frontend builds; set it only to update an app already in a store (frontend-fundamentals guide)
[Flutter]
IosBundleId = ""  # The iOS bundle identifier, e.g. "com.example.events"; empty takes AndroidApplicationId, then app.ikon.s<space id>
AndroidApplicationId = ""  # The Android applicationId, e.g. "com.example.events"; empty takes IosBundleId, then app.ikon.s<space id>
AppleTeamId = ""  # The Apple Developer team that signs the iOS app; turns on iOS universal links
AndroidCertFingerprints = []  # SHA-256 fingerprints of the certificates that sign the Android app; turns on Android app links
AssociatedDomains = []  # Hostnames besides the app's own whose https links open the app

# What activating a deployed version does
[Activation]
StopSessions = false  # Stop every session of the app, so every client reconnects to the new version; false stops only yours

# Where this file deploys to, written by 'ikon link'
[Target]
SpaceId = ""  # The app's id
Name = ""  # The app's name, shown as its title (frontend-fundamentals guide)
Environment = ""  # "development" or "production" in a named target's file; empty in an environment's own file
