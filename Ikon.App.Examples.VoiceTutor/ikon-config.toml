# Database configurations for allocating databases for the app (run 'ikon app config' to apply changes)
# Assigned database connection info is available via app.Databases in the app. Use 'ikon app db' commands to manage databases.
# Format: "name:type" - valid types: postgres
# Examples: "mydb:postgres"
Databases = []

# Activation configuration for the app (app activation is separate from deployment)
[Activation]
# Whether to stop all active sessions of the app when a version of the app is activated
StopSessions = false

# Authentication configuration for the app frontend
[Auth]
# Whether the frontend requires authentication before connection to the app is established
Enabled = false
# Available methods: google, microsoft, email, guest
Methods = ["google"]
# If non-empty, only allow users with email addresses from these domains to authenticate (e.g. ["mycompany.com"])
DomainAllowlist = []
# Deferred login: when true (and "guest" is in Methods), visitors connect immediately as a guest
# session instead of being blocked by a login screen. Branch on Context.IsAnonymous in the app to
# decide what guests see, and trigger sign-in on demand with ClientFunctions.LoginAsync("google").
# Combine with [BootSnapshot] Routes to make a login-gated app's landing page SEO-crawlable.
DeferLogin = false

# Boot snapshot: capture the app's initial UI at build/deploy time so the first paint appears
# instantly. The snapshot is a PUBLIC asset, but it is privacy-safe by default — every piece of
# content is automatically replaced with a skeleton, so no sensitive data is baked in. Use
# SnapshotReveal to opt safe content (logos, static chrome) back in; a fully public landing-type
# page opts out wholesale by wrapping its page root in SnapshotReveal. See the Parallax library
# overview docs.
[BootSnapshot]
# Public routes to snapshot (e.g. ["/", "/pricing"]); an empty list disables boot snapshotting.
# Each route's snapshot paints instantly on load, and for guest-openable apps (Auth disabled, or
# "guest" in Auth.Methods) each route is also prerendered to crawlable static HTML with a generated
# sitemap.xml/robots.txt. Content routes (one per listing/article) can be added in app code via
# app.OnSnapshotRoutes(...). See the "Per-route snapshots and SEO" section of the Parallax docs.
Routes = ["/"]
# Signed-in shell skeleton (only for apps that render different pages per identity on the same
# path, e.g. a guest landing vs a signed-in hub): route where the app renders its signed-in shell
# for the snapshot capture client. The skeletonized capture is shown instantly while a signed-in
# user's instance boots. Never prerendered to HTML, never listed in the route manifest or sitemap.
# Empty means none.
ShellRoute = ""

# Versioned binary data folders for the app. Binaries are stored in the Ikon Asset store and git only
# tracks small .ikonasset pointer files, so even large data sets keep the repo light. Managed with the
# 'ikon app assets' commands.
[Assets]
# Top-level folders whose files are public: offloaded to public asset storage and loadable by URL from
# the frontend. Binaries in any other folder stay private and are only readable by the C# app.
PublicFolders = ["public"]

# Custom packaging steps for 'ikon app bundle' and 'ikon app deploy'
[Package]
# Commands run in the app root after the app + frontend build, before the bundle is zipped. The bundle
# staging directory is exposed as IKON_BUNDLE_DIR, so a command can write processed output straight
# into the package (e.g. ["python scripts/pack_assets.py"])
PrePackage = []

# Target information for deployment (automatically configured with 'ikon app config')
[Target]
OrganisationId = ""
SpaceId = ""
Name = ""
