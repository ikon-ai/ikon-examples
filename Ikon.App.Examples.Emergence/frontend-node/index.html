<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfcfc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Emergence" />
    <title>Emergence</title>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <div style="color-scheme:light dark;margin:48px auto 0;max-width:420px;padding:0 24px;text-align:center;color:CanvasText;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
        <div style="font-size:22px;font-weight:600;margin-bottom:10px;">JavaScript is required</div>
        <div style="font-size:15px;line-height:1.5;opacity:.75;">This app needs JavaScript to run. Please enable JavaScript in your browser settings and reload the page.</div>
      </div>
    </noscript>

    <script>
      function ikonMissingFeatures() {
        var missing = [];
        if (typeof WebSocket === 'undefined') missing.push('WebSocket');
        if (typeof fetch === 'undefined') missing.push('fetch');
        if (typeof BigInt === 'undefined') missing.push('BigInt');
        if (typeof globalThis === 'undefined') missing.push('globalThis');
        if (typeof Promise === 'undefined' || typeof Promise.allSettled !== 'function') missing.push('Promise.allSettled');
        return missing;
      }
      function ikonShowUnsupported() {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div style="color-scheme:light dark;margin:48px auto 0;max-width:420px;padding:0 24px;text-align:center;color:CanvasText;' +
          'font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">' +
          '<div style="font-size:22px;font-weight:600;margin-bottom:10px;">Browser not supported</div>' +
          '<div style="font-size:15px;line-height:1.5;opacity:.75;">This app needs a more recent browser to run. ' +
          'Please update your browser or device software and try again.</div>' +
          '</div>';
      }
      if (ikonMissingFeatures().length > 0) {
        ikonShowUnsupported();
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
